<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Circuito Terê Verde</title>
    <link rel="stylesheet" href="../Styles/Index.css">
    <link rel="stylesheet" href="../Styles/Admin.css">
    <link rel="shortcut icon" href="../Imagens/favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="main_header">
        <nav class="navbar">
            <div class="nav_logo">
                <img class="logo_Dedo_Deus" src="https://upload.wikimedia.org/wikipedia/pt/a/ad/Unifeso_logomarca.png" alt="dedo_de_deus_logo.png">
            </div>
            <div class="nav_content">
                <ul class="nav_menu">
                    <li><a href="../Index.html">Início</a></li>
                    <li><a href="Agenda.html">Agenda</a></li>
                    <li><a href="Sobre.html">Sobre</a></li>
                    <li><a href="Contato.html">Contato</a></li>
                    <li><a href="#" id="admin-link" style="color: #ff6b35;">Painel Admin</a></li>
                </ul>
                <div class="nav_login">
                    <button onclick="logout()" class="login_button">Sair</button>
                </div>
            </div>
        </nav>
    </header>

    <main style="padding: 2rem; min-height: 80vh;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 style="color: #2c5530; margin: 0;">Painel Administrativo</h1>
                <button onclick="logout()" style="background: #e53e3e; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: 600; transition: all 0.3s ease;">Deslogar</button>
            </div>
            <!-- código 3nzz0 Fadiga-->
            <div class="admin-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                <div class="admin-card" style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <h3 style="color: #2c5530; margin-bottom: 1rem;">📅 Agendamentos</h3>
                    <p>Visualizar e gerenciar reservas de trilhas</p>
                    <button class="trilhas_button" onclick="showAgendamentos()" style="margin-top: 1rem;">Ver Agendamentos</button>
                </div>

                <div class="admin-card" style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <h3 style="color: #2c5530; margin-bottom: 1rem;">👥 Usuários</h3>
                    <p>Visualizar e gerenciar usuários cadastrados</p>
                    <button class="trilhas_button" onclick="window.location.href='Usuarios.html'" style="margin-top: 1rem;">Ver Usuários</button>
                </div>

                <div class="admin-card" style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <h3 style="color: #2c5530; margin-bottom: 1rem;">🥾 Trilhas</h3>
                    <p>Cadastrar e gerenciar trilhas disponíveis</p>
                    <button class="trilhas_button" onclick="window.location.href='CadastroTrilha.html'" style="margin-top: 1rem;">Cadastrar Trilha</button>
                </div>

            </div>

            <!-- Seção de Agendamentos -->
            <div id="agendamentos-section" style="display: none; margin-top: 3rem;">
                <div style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <h2 style="color: #2c5530; margin-bottom: 1.5rem;">📋 Agendamentos Recentes</h2>
                    <div id="agendamentos-list"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/Auth.js"></script>
    <script src="../js/Index.js"></script>
    <script>
        // Verificar se usuário está logado como admin
        if (!isAdminLoggedIn()) {
            window.location.href = '../Index.html';
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = '../Index.html';
        }

        async function showAgendamentos() {
            const section = document.getElementById('agendamentos-section');
            const list = document.getElementById('agendamentos-list');

            try {
                const res = await fetch('http://localhost:3000/api/agendamentos', {
                    headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') }
                });
                const agendamentos = await res.json();

                if (!agendamentos.length) {
                    list.innerHTML = '<p style="text-align:center;color:#666;">Nenhum agendamento encontrado.</p>';
                } else {
                    list.innerHTML = agendamentos.map(a => `
                        <div style="border:1px solid #e0e0e0;border-radius:8px;padding:1rem;margin-bottom:1rem;">
                            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1rem;">
                                <div><strong>Nome:</strong> ${a.nome}</div>
                                <div><strong>Email:</strong> ${a.email}</div>
                                <div><strong>Telefone:</strong> ${a.telefone}</div>
                                <div><strong>Trilha:</strong> ${a.trilha}</div>
                                <div><strong>Data:</strong> ${new Date(a.data).toLocaleDateString('pt-BR')}</div>
                                <div><strong>Horário:</strong> ${a.horario}</div>
                                <div><strong>Pessoas:</strong> ${a.pessoas}</div>
                                <div><strong>Status:</strong> <span style="color:#4caf50;font-weight:bold;">${a.status}</span></div>
                            </div>
                            <button onclick="excluirAgendamento(${a.id})" style="background:#e53e3e;color:white;border:none;padding:8px 16px;border-radius:5px;cursor:pointer;font-weight:600;">🗑️ Excluir</button>
                        </div>
                    `).join('');
                }
            } catch {
                list.innerHTML = '<p style="color:red;">Erro ao carregar agendamentos.</p>';
            }

            section.style.display = 'block';
            section.scrollIntoView({ behavior: 'smooth' });
        }

        async function excluirAgendamento(id) {
            if (confirm('Tem certeza que deseja excluir este agendamento?')) {
                await fetch(`http://localhost:3000/api/agendamentos/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') }
                });
                showAgendamentos();
            }
        }
    </script>
</body>
</html>
